<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="project1.css">
</head>
<body>
    
    <header>
        <h1>CALCULATOR</h1>
    </header>

    <section class="section1">

        <input type="text" id="display">

        <div class="buttons">

            <button id="b1" class="btn" value="7">7</button>
            <button id="b1" class="btn" value="8">8</button>
            <button id="b1" class="btn" value="9">9</button>


            <button id="b1" class="btn" value="4">4</button>
            <button id="b1" class="btn" value="5">5</button>
            <button id="b1" class="btn" value="6">6</button>

            <button id="b1" class="btn" value="1">1</button>
            <button id="b1" class="btn" value="2">2</button>
            <button id="b1" class="btn" value="3">3</button>

            <button id="b1" class="btn" value="0">0</button>
            <button id="b1" class="btn" value=".">.</button>
            <button id="b1" class="equal" value="=">=</button>

            <button id="b1" class="add" value="+">+</button>
            <button id="b1" class="div" value="/">/</button>
            <button id="b1" class="mul" value="x">x</button>

            <button id="b1" class="minus" value="-">-</button>
            <button id="b1" class="allclr" value="AC">AC</button>
            <button id="b1" class="clr" value="C">C</button>
            

        </div>
    </section>
    
</body>

<script src="project1.js"></script>
</html>
